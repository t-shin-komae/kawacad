name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  linux-quality-core:
    name: linux-quality-core
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/tauri/KawaCAD/package-lock.json

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain

      - name: Cache Cargo registry and git dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ runner.os }}-${{ runner.arch == 'X64' && 'x64' || runner.arch }}-kawacad-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            cargo-deps-${{ runner.os }}-${{ runner.arch == 'X64' && 'x64' || runner.arch }}-kawacad-rust-
          save-always: true

      - name: Cache Rust target for linux-quality-core
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ runner.arch == 'X64' && 'x64' || runner.arch }}-linux-quality-core-kawacad-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-${{ runner.arch == 'X64' && 'x64' || runner.arch }}-linux-quality-core-kawacad-rust-
          save-always: true

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Cache frontend dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/tauri/KawaCAD/node_modules
          key: tauri-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/tauri/KawaCAD/package-lock.json') }}
          restore-keys: |
            tauri-node-modules-${{ runner.os }}-${{ runner.arch }}-

      - name: Install frontend dependencies
        run: npm ci --prefix apps/tauri/KawaCAD

      - name: Run formatting, lint, and type checks
        run: node scripts/kawacad.mjs pre-commit

      - name: Test project automation
        run: node --test scripts/test/kawacad.test.mjs

      - name: Test Rust Core
        run: node scripts/kawacad.mjs test --scope core

      - name: Verify tracked files are unchanged
        run: git diff --exit-code

  linux-tauri:
    name: linux-tauri
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/tauri/KawaCAD/package-lock.json

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain

      - name: Cache Cargo registry and git dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ runner.os }}-${{ runner.arch == 'X64' && 'x64' || runner.arch }}-kawacad-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            cargo-deps-${{ runner.os }}-${{ runner.arch == 'X64' && 'x64' || runner.arch }}-kawacad-rust-
          save-always: true

      - name: Cache Rust target for linux-tauri
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ runner.arch == 'X64' && 'x64' || runner.arch }}-linux-tauri-kawacad-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '**/Cargo.toml') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-${{ runner.arch == 'X64' && 'x64' || runner.arch }}-linux-tauri-kawacad-rust-
          save-always: true

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            avahi-daemon \
            cups \
            cups-client \
            cups-ipp-utils \
            dbus \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Cache frontend dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/tauri/KawaCAD/node_modules
          key: tauri-node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/tauri/KawaCAD/package-lock.json') }}
          restore-keys: |
            tauri-node-modules-${{ runner.os }}-${{ runner.arch }}-

      - name: Install frontend dependencies
        run: npm ci --prefix apps/tauri/KawaCAD

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/tauri/KawaCAD/package-lock.json') }}

      - name: Install Chromium system dependencies
        working-directory: apps/tauri/KawaCAD
        run: npx playwright install-deps chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/tauri/KawaCAD
        run: npx playwright install chromium

      - name: Test Tauri application
        run: node scripts/kawacad.mjs test --scope tauri --e2e

      - name: Start virtual CUPS printer
        run: |
          sudo systemctl start cups.service
          sudo systemctl start avahi-daemon.service
          for attempt in {1..20}; do
            if lpstat -r | grep -q 'scheduler is running'; then
              break
            fi
            sleep 0.25
          done
          lpstat -r | grep -q 'scheduler is running'

          ippeveprinter -p 8631 KawaCAD-IPP > "$RUNNER_TEMP/ippeveprinter.log" 2>&1 &
          for attempt in {1..20}; do
            if (echo > /dev/tcp/127.0.0.1/8631) >/dev/null 2>&1; then
              break
            fi
            sleep 0.25
          done
          if ! (echo > /dev/tcp/127.0.0.1/8631) >/dev/null 2>&1; then
            cat "$RUNNER_TEMP/ippeveprinter.log" >&2
            exit 1
          fi

          sudo lpadmin -x kawacad-virtual >/dev/null 2>&1 || true
          sudo lpadmin -p kawacad-virtual -E -v ipp://127.0.0.1:8631/ipp/print -m everywhere
          sudo cupsaccept kawacad-virtual
          sudo cupsenable kawacad-virtual
          lpstat -v kawacad-virtual

      - name: Test Linux direct printing through CUPS
        env:
          KAWACAD_CUPS_E2E_PRINTER: kawacad-virtual
        run: |
          cargo test --manifest-path apps/tauri/KawaCAD/src-tauri/Cargo.toml --lib \
            submits_a4_pdf_to_the_configured_cups_printer

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/tauri/KawaCAD/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Linux Tauri application
        run: node scripts/kawacad.mjs release --platform linux

      - name: Verify tracked files are unchanged
        run: git diff --exit-code

  windows-tauri-direct-print:
    name: windows-tauri-direct-print
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Compile and test Windows direct printing
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo clippy --manifest-path apps/tauri/KawaCAD/src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path apps/tauri/KawaCAD/src-tauri/Cargo.toml --all-targets

  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - linux-quality-core
      - linux-tauri
      - windows-tauri-direct-print
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all CI jobs to pass
        env:
          LINUX_QUALITY_CORE_RESULT: ${{ needs.linux-quality-core.result }}
          LINUX_TAURI_RESULT: ${{ needs.linux-tauri.result }}
          WINDOWS_TAURI_DIRECT_PRINT_RESULT: ${{ needs.windows-tauri-direct-print.result }}
        run: |
          if [[ "$LINUX_QUALITY_CORE_RESULT" != "success" || \
                "$LINUX_TAURI_RESULT" != "success" || \
                "$WINDOWS_TAURI_DIRECT_PRINT_RESULT" != "success" ]]; then
            echo "Required CI job failed or did not run."
            exit 1
          fi
