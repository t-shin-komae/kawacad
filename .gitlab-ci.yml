stages:
  - check
  - test
  - build

variables:
  CARGO_TERM_COLOR: always
  CLANG_MODULE_CACHE_PATH: "$CI_PROJECT_DIR/.ci/clang-module-cache"
  SWIFTPM_MODULECACHE_OVERRIDE: "$CI_PROJECT_DIR/.ci/swiftpm-module-cache"

runner_check:
  stage: check
  tags:
    - macos-tart
  image: ghcr.io/cirruslabs/macos-tahoe-xcode:26.5
  script:
    - mkdir -p "$CLANG_MODULE_CACHE_PATH" "$SWIFTPM_MODULECACHE_OVERRIDE"
    - sw_vers
    - xcodebuild -version
    - node --version
    - cargo --version
    - npm ci --prefix apps/tauri/KawaCAD
    - node scripts/kawacad.mjs pre-commit
    - npm run check:architecture --prefix apps/tauri/KawaCAD

tests:
  stage: test
  tags:
    - macos-tart
  image: ghcr.io/cirruslabs/macos-tahoe-xcode:26.5
  script:
    - mkdir -p "$CLANG_MODULE_CACHE_PATH" "$SWIFTPM_MODULECACHE_OVERRIDE"
    - npm ci --prefix apps/tauri/KawaCAD
    - cargo build -p kawacad-core-process
    - node scripts/kawacad.mjs test --scope all --live-core --e2e

build:
  stage: build
  tags:
    - macos-tart
  image: ghcr.io/cirruslabs/macos-tahoe-xcode:26.5
  script:
    - mkdir -p "$CLANG_MODULE_CACHE_PATH" "$SWIFTPM_MODULECACHE_OVERRIDE"
    - npm ci --prefix apps/tauri/KawaCAD
    - cargo build --workspace
    - swift build --package-path apps/macos/KawaCAD
    - npm run build --prefix apps/tauri/KawaCAD
