[package]
name = "kawacad-core-process"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "kawacad-core-process"
path = "src/main.rs"

[dependencies]
kawacad-core = { path = "../kawacad-core" }
kawacad-output-engine = { path = "../kawacad-output-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
