[package]
name = "kawa-cad-tauri"
version = "0.4.0"
description = "Cross-platform Tauri + React application for KawaCAD"
edition.workspace = true
license.workspace = true

[lib]
name = "kawa_cad_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kawacad-core = { path = "../../../../crates/kawacad-core" }
kawacad-output-engine = { path = "../../../../crates/kawacad-output-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["errhandlingapi", "wingdi", "winspool"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.7"
